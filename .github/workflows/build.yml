name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    container:
      # Matches the ESP-IDF version the project is developed against (.vscode/settings.json).
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4

      - name: Build release firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # Release-style build: its own directory and config, generated only from the
          # tracked sdkconfig.defaults (empty credential fields) -- see CLAUDE.md.
          rm -f sdkconfig.release
          idf.py -B build-release -D SDKCONFIG=sdkconfig.release set-target esp32s3
          idf.py -B build-release -D SDKCONFIG=sdkconfig.release build
          # Single image for a first-time USB flash at offset 0x0.
          idf.py -B build-release -D SDKCONFIG=sdkconfig.release merge-bin -o braindump-full.bin

      - name: Collect firmware files
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          mkdir -p dist
          # App image only: this is the file an over-the-air update installs.
          cp build-release/braindump.bin "dist/braindump-${version}-update.bin"
          cp build-release/braindump-full.bin "dist/braindump-${version}-full-usb-flash.bin"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  # A version tag (vX.Y.Z, see docs/versioning.md) publishes a GitHub Release that devices
  # install from directly (Settings > About > Check for updates). The device reads
  # releases/latest/download/braindump-manifest.json, so every release must carry that file.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, tests, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Check the tag matches version.txt
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.txt (${version}); bump version.txt or retag." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Write the update manifest
        shell: bash
        run: |
          update="dist/braindump-${VERSION}-update.bin"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$update")"
          python3 - "$update" "$url" "$VERSION" > dist/braindump-manifest.json <<'PY'
          import hashlib, json, os, sys
          path, url, version = sys.argv[1:4]
          data = open(path, "rb").read()
          json.dump({
              "project": "braindump",
              "version": version,
              "url": url,
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
          }, sys.stdout, indent=2)
          PY
          cat dist/braindump-manifest.json

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          # The "## [X.Y.Z]" section, up to the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for ${VERSION}." > release-notes.md
          fi

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag (v1.9.0-rc1) is published as a pre-release, which
          # releases/latest skips, so devices never pick it up on their own.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Brain Dump ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            "dist/braindump-${VERSION}-update.bin" \
            "dist/braindump-${VERSION}-full-usb-flash.bin" \
            dist/braindump-manifest.json

  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests on the build machine (not part of the firmware)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcjson-dev
          tests/host/run.sh

  web:
    name: Web page (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webserver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Committed portal files match the source
        run: |
          for f in index.html index.js index.css; do
            cmp "dist/$f" "../components/wifi_service/portal/$f" || {
              echo "components/wifi_service/portal/$f is stale: run npm run build and copy dist/ there"; exit 1; }
          done

      - name: Unit tests
        run: npm test

      - name: Browser test against a fake device
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  screens:
    name: Screen previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render device screens to PNG
        run: |
          python3 -m pip install --quiet pillow
          tools/preview/render.sh "$PWD/preview-out"

      - uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: preview-out/*.png
          if-no-files-found: error
